<section class="contact" id="contact" style="padding: 150px 0;">
    <div class="container">
        <div class="section-header reveal">
            <span class="section-subtitle" data-i18n="cont-title">Get In Touch</span>
            <h2 class="section-title" data-i18n="cont-subtitle">Let's <span class="text-gradient">Collaborate</span></h2>
        </div>

        <div class="contact-container reveal" style="max-width: 900px; margin: 4rem auto 0; display: grid; grid-template-columns: 1fr 1.5fr; gap: 4rem;">
            <div class="contact-info">
                <h3 style="font-size: 1.8rem; margin-bottom: 2rem;" data-i18n="cont-details">Contact Details</h3>
                <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <i class="fas fa-envelope" style="color: var(--accent); font-size: 1.2rem;"></i>
                        <span style="color: var(--text-muted);">wahyuning.004@gmail.com</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <i class="fas fa-location-dot" style="color: var(--accent); font-size: 1.2rem;"></i>
                        <span style="color: var(--text-muted);">Bekasi Utara, Jawa Barat, Indonesia</span>
                    </div>
                    
                    <div style="margin-top: 3rem;">
                        <h4 style="font-size: 1.1rem; margin-bottom: 1.5rem; color: var(--text-main);" data-i18n="cont-follow">Follow Me:</h4>
                        <div style="display: flex; gap: 1rem;">
                            <a href="https://www.instagram.com/ekawhynngtysa/" target="_blank" class="action-btn" title="Instagram">
                                <i class="fab fa-instagram"></i>
                            </a>
                            <a href="https://www.tiktok.com/@ekkaaa_4" target="_blank" class="action-btn" title="TikTok">
                                <i class="fab fa-tiktok"></i>
                            </a>
                            <a href="https://www.linkedin.com/in/eka-wahyuning-tiyasa/" target="_blank" class="action-btn" title="LinkedIn">
                                <i class="fab fa-linkedin-in"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <form class="contact-form glass" style="padding: 3rem; border-radius: 24px; display: flex; flex-direction: column; gap: 1.5rem;">
                <input type="text" data-i18n="form-name" placeholder="Your Name" style="background: var(--bg-surface); border: 1px solid var(--glass-border); padding: 1rem; border-radius: 12px; color: var(--text-main); outline: none; font-family: inherit;">
                <input type="email" data-i18n="form-email" placeholder="Your Email" style="background: var(--bg-surface); border: 1px solid var(--glass-border); padding: 1rem; border-radius: 12px; color: var(--text-main); outline: none; font-family: inherit;">
                <textarea data-i18n="form-msg" placeholder="Your Message" rows="5" style="background: var(--bg-surface); border: 1px solid var(--glass-border); padding: 1rem; border-radius: 12px; color: var(--text-main); outline: none; font-family: inherit; resize: none;"></textarea>
                <button type="submit" class="btn btn-primary" style="font-family: inherit;" data-i18n="form-btn">Send Message</button>
            </form>
        </div>
    </div>
</section>
